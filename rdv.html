<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prendre un rendez-vous – YodotKa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">YODOT<span>KA</span></div>
    <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="shiatsu.html">Shiatsu</a></li>
        <li><a href="kobido.html">Kobido</a></li>
        <li><a href="yoga.html">Yoga</a></li>
        <li><a href="rdv.html" class="active">Prendre RDV</a></li>
    </ul>
</nav>

<header class="hero">
    <div class="hero-content">
        <h1>Prendre un rendez-vous</h1>
        <p>Réservez votre séance bien-être en quelques instants.</p>
    </div>
</header>

<section class="intro" style="max-width:600px; margin:auto;">

    <h2>Réservation</h2>

    <form id="rdvForm" action="https://formsubmit.co/prunefacet@gmail.com" method="POST">

        <input type="hidden" name="_subject" value="Nouveau rendez-vous">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">

        <label>Nom :</label>
        <input type="text" name="nom" required>

        <label>Prénom :</label>
        <input type="text" name="prenom" required>

        <label>Email :</label>
        <input type="email" name="email" required>

        <label>Type de soin :</label>
        <select id="service" name="service" required>
            <option value="">Choisir</option>
            <option value="kobido">Kobido (90 min)</option>
            <option value="shiatsu">Shiatsu (90 min)</option>
            <option value="express">Kobido express (30 min)</option>
        </select>

        <label>Date :</label>
        <select id="date" name="date" required>
            <option value="">Choisir une date</option>
        </select>

        <label>Créneau :</label>
        <select id="creneau" name="creneau" required>
            <option value="">Choisir d'abord une date</option>
        </select>

        <button type="submit">Réserver</button>
    </form>

    <p id="message"></p>
</section>

<script src="rdv.js"></script>
</body>
</html>
