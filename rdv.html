<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Prendre un rendez-vous – YodotKa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="logo">YODOT<span>KA</span></div>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="shiatsu.html">Shiatsu</a></li>
            <li><a href="kobido.html">Kobido</a></li>
            <li><a href="yoga.html">Yoga</a></li>
            <li><a href="rdv.html" class="active">Prendre RDV</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <header class="hero">
        <div class="hero-content fade-up">
            <h1>Prendre un rendez-vous</h1>
            <p>Réservez votre séance bien‑être en quelques instants.</p>
        </div>

        <img src="img/ginkgo.svg" class="ginkgo g1">
        <img src="img/ginkgo.svg" class="ginkgo g2">
    </header>

    <!-- FORMULAIRE -->
    <section class="intro fade-up" style="max-width:600px;">
        <h2>Formulaire de réservation</h2>

        <form id="rdvForm" action="https://formsubmit.co/prunefacet@gmail.com" method="POST">

            <!-- Champs cachés FormSubmit -->
            <input type="hidden" name="_subject" value="Nouveau rendez-vous depuis le site">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <label>Nom :</label>
            <input type="text" name="nom" id="nom" required>

            <label>Prénom :</label>
            <input type="text" name="prenom" id="prenom" required>

            <label>Email :</label>
            <input type="email" name="email" id="email" required>

            <label>Date du rendez-vous :</label>
            <input type="date" name="date" id="date" required>

            <label>Créneau horaire :</label>
            <select name="creneau" id="creneau" required>
                <option value="">Sélectionnez une date d'abord</option>
            </select>

            <button type="submit" class="btn">Réserver</button>
        </form>

        <p id="message"></p>
    </section>

    <footer>
        <p>© 2026 GinkgoZen — Bien‑être & pratiques japonaises</p>
    </footer>

    <script src="rdv.js"></script>
</body>
</html>
